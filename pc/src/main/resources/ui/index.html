<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HaoAI · PC</title>
<style>
  :root{
    --bg:#0e1210; --panel:#151b18; --glass:rgba(255,255,255,.045); --line:rgba(255,255,255,.09);
    --fg:#e8efeb; --dim:#9fb0a8; --acc:#34d399; --acc2:#1f6f4a; --warn:#f0b866; --err:#f27d72;
    --mono:ui-monospace,"Cascadia Mono",Consolas,"Noto Sans Mono CJK SC",monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:
      radial-gradient(1200px 700px at 12% -8%,#1b2a22 0%,transparent 60%),
      radial-gradient(900px 600px at 100% 0%,#152230 0%,transparent 55%),var(--bg);
    color:var(--fg);font:14px/1.65 -apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;overflow:hidden}
  .app{display:grid;grid-template-columns:230px 1fr 260px;height:100%}
  .rail{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.012));
    border-right:1px solid var(--line);padding:14px 12px;overflow:auto}
  .rail.r{border-right:0;border-left:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.3px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--acc);box-shadow:0 0 12px var(--acc)}
  .sub{color:var(--dim);font-size:12px;margin:2px 0 14px}
  .btn{display:block;width:100%;padding:9px 10px;border-radius:10px;border:1px solid var(--line);
    background:var(--glass);color:var(--fg);cursor:pointer;font-size:13px;text-align:center}
  .btn:hover{border-color:var(--acc2)}
  .btn.pri{background:linear-gradient(180deg,var(--acc2),#17553a);border-color:#2b8f63;font-weight:600}
  .grp{margin:16px 0 6px;color:var(--dim);font-size:11px;letter-spacing:.6px;text-transform:uppercase}
  .kv{font-size:12px;color:var(--dim);word-break:break-all;line-height:1.5}
  .kv b{color:var(--fg);font-weight:600}
  .mini{background:var(--glass);border:1px solid var(--line);color:var(--dim);border-radius:7px;
    font-size:10.5px;padding:1px 6px;cursor:pointer;margin-left:6px}
  .sess{display:flex;flex-direction:column;gap:4px}
  .sess .it{border:1px solid var(--line);background:var(--glass);border-radius:9px;padding:6px 46px 6px 8px;
    cursor:pointer;font-size:12px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sess .it:hover{border-color:var(--acc2);color:var(--fg)}
  .sess .it.cur{border-color:var(--acc2);background:rgba(31,111,74,.22);color:var(--fg)}
  .sess .it i{font-style:normal;opacity:.65;font-size:11px}
  /* 悬停才露出改名/删除：常驻的话侧栏每条都挂两个小方块，比要管的会话还显眼 */
  .sess .it{position:relative}
  .sess .it .act{position:absolute;right:5px;top:4px;display:flex;gap:3px;opacity:0;transition:opacity .12s}
  .sess .it:hover .act{opacity:1}
  .sess .it .act b{font-weight:400;cursor:pointer;color:var(--dim);border:1px solid var(--line);
    border-radius:5px;padding:0 5px;font-size:10px;line-height:15px;background:rgba(0,0,0,.45)}
  .sess .it .act b:hover{color:var(--fg);border-color:var(--acc2)}
  /* 多会话并行：一条会话一个视图容器，只有当前这条可见。
     后台会话的事件照样写进它自己那个容器 —— 切回去不用重拉、也不丢中间输出。 */
  .view{display:none}
  .view.on{display:block}
  /* 跑着的会话在左侧点一道绿光；只在后台跑、不在眼前时最容易漏 */
  .sess .it.run{border-color:var(--acc2)}
  .sess .it.run::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
    background:var(--acc);border-radius:9px 0 0 9px;animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  /* 后台攒下的新内容 / 等人回答：一个数字角标说清楚"这条需要我"还是"只是有新东西" */
  .sess .it .nb{position:absolute;right:6px;top:5px;min-width:15px;padding:0 4px;border-radius:8px;
    background:var(--acc2);color:#eafff5;font-size:10px;font-weight:700;text-align:center;line-height:15px}
  .sess .it.wait .nb{background:var(--warn);color:#241a08}
  .sess .it.wait{border-color:var(--warn)}
  /* 悬停时 ✎/✕ 会出现在同一个右上角，把角标往左挪而不是藏起来 */
  .sess .it:hover .nb{right:44px}
  .fld{margin:8px 0}
  .fld label{display:block;font-size:11px;color:var(--dim);margin-bottom:3px}
  .sw{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-top:1px solid var(--line)}
  .sw input{margin-top:3px}
  .sw .t{font-size:12.5px}
  .sw .d{font-size:11px;color:var(--dim);line-height:1.45}
  /* min-height:0 是必需的：grid 项默认 min-height:auto，长会话会把 .main 顶到比视口还高，
     于是 #stream 自己永远不溢出（scrollTop 白设），footer 连同发送/停止按钮被推到屏幕外。
     实测：跑 20 轮之后截图里根本看不到输入框，用户想停都找不到按钮。 */
  .main{display:flex;flex-direction:column;min-width:0;min-height:0}
  header{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);
    background:rgba(10,14,12,.55);backdrop-filter:blur(10px)}
  header h1{font-size:14px;margin:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .modes{margin-left:auto;display:flex;gap:4px;background:var(--glass);border:1px solid var(--line);
    border-radius:999px;padding:3px}
  .modes button{border:0;background:transparent;color:var(--dim);font-size:12px;padding:4px 11px;
    border-radius:999px;cursor:pointer}
  .modes button.on{background:var(--acc2);color:#fff}
  .usage{font-size:11px;color:var(--dim);white-space:nowrap}
  #stream{flex:1;min-height:0;overflow:auto;padding:18px 20px 8px;scroll-behavior:smooth}
  .msg{margin:0 auto 14px;max-width:860px}
  .msg.user{background:linear-gradient(180deg,#1d2a24,#182320);border:1px solid #2a3b33;
    border-radius:14px;padding:10px 14px;white-space:pre-wrap}
  .msg.ans{padding:2px 2px 2px 0}
  .card{border:1px solid var(--line);background:var(--glass);border-radius:12px;margin:8px 0;overflow:hidden}
  .card>summary{cursor:pointer;padding:8px 12px;font-size:12.5px;color:var(--dim);display:flex;gap:8px;align-items:center}
  .card>summary b{color:var(--fg);font-weight:600;font-family:var(--mono);font-size:12px}
  .card .body{margin:0;padding:10px 12px;border-top:1px solid var(--line);background:rgba(0,0,0,.28);
    font-family:var(--mono);font-size:12px;line-height:1.55;white-space:pre-wrap;max-height:340px;overflow:auto;color:#cfe0d7}
  .ok{color:var(--acc)} .bad{color:var(--err)}
  .tick{width:6px;height:6px;border-radius:50%;background:var(--acc);display:inline-block}
  .run .tick{background:var(--warn);animation:p 1s infinite}
  @keyframes p{50%{opacity:.25}}
  .notice{font-size:12.5px;color:var(--warn);border-left:2px solid var(--warn);padding-left:10px;margin:8px 0}
  .err{font-size:12.5px;color:var(--err);border-left:2px solid var(--err);padding-left:10px;margin:8px 0}
  .md code{font-family:var(--mono);background:rgba(255,255,255,.07);padding:1px 5px;border-radius:5px;font-size:12.5px}
  .md pre{background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:10px;padding:10px 12px;overflow:auto}
  .md pre code{background:transparent;padding:0}
  .md h2,.md h3{margin:14px 0 6px;font-size:14px}
  .md ul,.md ol{margin:6px 0;padding-left:22px}
  .md a{color:var(--acc)}
  .md p{margin:0 0 2px}
  .md .gap{height:9px}
  .md blockquote{margin:6px 0;padding:2px 0 2px 12px;border-left:2px solid var(--acc2);color:var(--dim)}
  /* 代码块右上角标语言：模型经常一个回答里混 kotlin / gradle / shell 三块 */
  .md pre{position:relative}
  .md pre[data-lang]::before{content:attr(data-lang);position:absolute;top:6px;right:10px;
    font-size:10px;color:var(--dim);opacity:.75;font-family:var(--mono)}
  .md pre[data-lang]{padding-top:24px}
  footer{padding:10px 16px 14px;border-top:1px solid var(--line);background:rgba(10,14,12,.5)}
  .inwrap{max-width:860px;margin:0 auto;display:flex;gap:8px;align-items:flex-end;
    background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
  textarea{flex:1;border:0;outline:0;resize:none;background:transparent;color:var(--fg);
    font:inherit;max-height:160px;min-height:24px;padding:4px}
  .send{width:34px;height:34px;border-radius:10px;border:0;background:linear-gradient(180deg,var(--acc),#1fa46e);
    color:#062017;font-size:16px;cursor:pointer;font-weight:700}
  .send[disabled]{opacity:.4;cursor:default}
  .send.stop{background:linear-gradient(180deg,#b4483f,#7c2f28);box-shadow:0 0 0 1px #c9614f inset}
  .todo{list-style:none;padding:0;margin:0;font-size:12.5px}
  .todo li{display:flex;gap:7px;align-items:flex-start;margin-bottom:6px;color:var(--dim)}
  .todo li.done{color:#5d7a6c;text-decoration:line-through}
  .todo li.doing{color:var(--fg)}
  .mark{font-family:var(--mono);font-size:11px}
  .mask{position:fixed;inset:0;background:rgba(6,10,8,.66);backdrop-filter:blur(4px);
    display:none;align-items:center;justify-content:center;z-index:20}
  .mask.on{display:flex}
  .dialog{width:min(560px,92vw);background:var(--panel);border:1px solid #2c4038;border-radius:16px;
    padding:18px;box-shadow:0 24px 60px rgba(0,0,0,.5)}
  .dialog h3{margin:0 0 4px;font-size:15px}
  .dialog .kind{font-size:11px;color:var(--warn);letter-spacing:.5px}
  .dialog pre{white-space:pre-wrap;word-break:break-all;background:rgba(0,0,0,.32);border-radius:10px;
    padding:10px 12px;font-family:var(--mono);font-size:12px;max-height:240px;overflow:auto}
  .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
  .acts .btn{width:auto;padding:8px 14px}
  /* 「这条是谁在问」与「还有几个在等」放在按钮上方一行：
     多会话并行时按钮已经有四个，再往里塞一个跳转按钮会挤成两排，看着像两组不同的操作。 */
  .who{display:flex;gap:12px;align-items:center;margin-top:12px;flex-wrap:wrap}
  .who .q{color:var(--dim);font-size:11px}
  .lnk{background:none;border:0;color:var(--acc);cursor:pointer;font-size:12.5px;padding:0;
    text-decoration:underline;text-underline-offset:3px}
  .lnk:hover{color:#7ef0bd}
  .acts .deny{color:var(--err);border-color:#4a2b28}
  .opts{display:flex;flex-direction:column;gap:6px;margin-top:8px}
  .opts .btn{text-align:left}
  input[type=text]{width:100%;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:10px;
    color:var(--fg);padding:8px 10px;font:inherit;outline:0}
  ::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#26332d;border-radius:9px}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand"><span class="dot"></span> HaoAI <span style="font-weight:400;color:var(--dim);font-size:12px">PC</span></div>
    <div class="sub">本机 Agent · v0.1.0</div>
    <button class="btn pri" id="newBtn">＋ 新任务</button>
    <div class="grp">工作区</div>
    <div class="kv" id="ws">—</div>
    <div class="grp">大脑</div>
    <div class="kv" id="model">—</div>
    <div class="grp">历史会话 <button id="cfgBtn" class="mini" title="设置">⚙ 设置</button></div>
    <div id="sessions" class="sess"></div>
    <div class="grp">说明</div>
    <div class="kv">
      <b>plan</b> 只读调研出方案<br>
      <b>ask</b> 写文件/执行命令先问<br>
      <b>auto</b> 全自动，不再打断
    </div>
  </aside>

  <main class="main">
    <header>
      <h1 id="title">新会话</h1>
      <div class="usage" id="usage"></div>
      <div class="modes" id="modes">
        <button data-m="plan">计划</button>
        <button data-m="ask">询问</button>
        <button data-m="auto">自动</button>
      </div>
    </header>
    <div id="stream"></div>
    <footer>
      <div class="inwrap">
        <textarea id="box" rows="1" placeholder="给 HaoAI 派个活…（Enter 发送 / Shift+Enter 换行）"></textarea>
        <button class="send" id="send">➤</button>
      </div>
    </footer>
  </main>

  <aside class="rail r">
    <div class="grp">任务清单</div>
    <ul class="todo" id="todos"><li><span class="mark">·</span>（还没开始）</li></ul>
    <div class="grp">本次用量</div>
    <div class="kv" id="usage2">输入 0 / 输出 0</div>
    <div class="grp">提示</div>
    <div class="kv">长输出会存进工作区 <b>.haoai-output/</b>，卡片里能看到路径。</div>
  </aside>
</div>

<div class="mask" id="mask"><div class="dialog" id="dialog"></div></div>

<script>
const $=s=>document.querySelector(s), stream=$('#stream'), box=$('#box');
let mode='ask', stopping=false, curId='';

/* ---- 多会话视图 ----------------------------------------------------------
 * 每条会话一份自己的 DOM。后台那条跑起来时事件必须写进它自己的容器：
 * 上一版所有事件都往 #stream 里塞，于是"开着 A 等 B 的结果"会把 B 的输出
 * 掉进 A 的对话流里，看起来像 A 说了 B 的话。
 * ------------------------------------------------------------------------ */
const views={};
function view(sid){
  sid=sid||'';
  let v=views[sid];
  if(!v){
    v={sid:sid,el:el('<div class="view"></div>'),curAns:null,acc:'',tools:{},unread:0,running:false,wait:false,
       title:'新会话',todos:[],usage:null,mode:mode,workspace:'',model:''};
    views[sid]=v;stream.appendChild(v.el);
  }
  return v;
}
function cur(){return view(curId)}
function show(sid){
  const v=view(sid);curId=v.sid;
  Object.keys(views).forEach(k=>views[k].el.classList.toggle('on',k===curId));
  v.unread=0;v.wait=false;
  $('#title').textContent=v.title||'新会话';
  // 左栏那两行也是**这条会话的**事实：工作区每条会话各留一份，模型是当前全局的
  $('#ws').textContent=v.workspace||'—';$('#model').textContent=v.model||'—';
  setMode(v.mode||mode);paintTodos(v.todos);paintUsage(v.usage);paintSend();scroll();markSessions();
}
function scroll(){stream.scrollTop=stream.scrollHeight}

// 数字也要能进来：esc(4096) 之前会直接 TypeError（number 没有 .replace），
// 而设置抽屉里一旦有人把数字塞进模板，整个弹窗就画不出来了。
function esc(t){return String(t==null?'':t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function md(t) {
  if (t == null || String(t).trim() === '') return '';   // 空回答不该产出任何标记（否则多一个空隔块）
  const esc2 = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  const inline = s => s
    .replace(/`([^`\n]+)`/g, (_, c) => `<code>${c}</code>`)
    .replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>')
    .replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,!;?]|$)/g, '$1<i>$2</i>')
    .replace(/\[([^\]\n]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|[^"'>])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  
  // 1) 先把围栏代码块整块搬出去：行级规则一律不许碰它
  const blocks = [];
  let src = String(t == null ? '' : t).replace(/```([^\n`]*)\r?\n([\s\S]*?)```/g,
    (m, lang, code) => {
      blocks.push({ lang: lang.trim(), code: code.replace(/\n$/, '') });
      return '\u0000' + (blocks.length - 1) + '\u0000';
    });
  // 2) 整段转义：后面拼进去的标签才是我们自己造的
  src = esc2(src);
  
  const out = [];
  let list = null;
  const closeList = () => { if (list) { out.push(list === 'o' ? '</ol>' : '</ul>'); list = null } };
  const putBlock = i => {
    const b = blocks[i];
    if (!b) return '';
    // 代码内容必须在这里补转义：块是在"整段转义"之前搬出去的，
    // 不转义就等于模型（或它引用的文件内容）能在页面里塞标签。
    return `<pre${b.lang ? ` data-lang="${esc2(b.lang)}"` : ''}><code>${esc2(b.code)}</code></pre>`;
  };
  
  src.split(/\r?\n/).forEach(raw => {
    const line = raw.replace(/\s+$/, '');
    let m = line.match(/^\u0000(\d+)\u0000$/);
    if (m) { closeList(); out.push(putBlock(+m[1])); return }
    m = line.match(/^(#{1,4}) +(.*)$/);
    if (m) { closeList(); const lv = m[1].length; out.push(`<h${lv}>${inline(m[2])}</h${lv}>`); return }
    m = line.match(/^&gt; +(.*)$/);
    if (m) { closeList(); out.push(`<blockquote>${inline(m[1])}</blockquote>`); return }
    m = line.match(/^[-*+] +(.*)$/);
    if (m) { if (list !== 'u') { closeList(); out.push('<ul>'); list = 'u' } out.push(`<li>${inline(m[1])}</li>`); return }
    m = line.match(/^\d+[.)] +(.*)$/);
    if (m) { if (list !== 'o') { closeList(); out.push('<ol>'); list = 'o' } out.push(`<li>${inline(m[1])}</li>`); return }
    if (!line.trim()) { closeList(); out.push('<div class="gap"></div>'); return }
    closeList();
    // 段落里的代码块占位符（模型把围栏和正文写在同一行时）也一并换回来
    out.push(`<p>${inline(line).replace(/\u0000(\d+)\u0000/g, (_, i) => putBlock(+i))}</p>`);
  });
  closeList();
  // 兜底：任何没被行级规则吃掉的占位符都要还原，不能把 \x00 数字漏在界面上
  return out.join('').replace(/\u0000(\d+)\u0000/g, (_, i) => putBlock(+i));
  }
function el(html){const d=document.createElement('div');d.innerHTML=html;return d.firstElementChild}
// add 默认写进"当前这一条"，带 v 参数就写进那条会话自己的容器（后台会话的输出不能混进眼前这条）
function add(node,v){const t=v||cur();t.el.appendChild(node);if(!v||t===cur())scroll();return node}
function answer(piece,v){
  const t=v||cur();
  if(!t.curAns){t.curAns=add(el(`<div class="msg ans md"></div>`),t);t.acc=''}
  /*
   * delta 是**增量**，必须累加着画。之前每次都用"当前这一小片"重画整个气泡，
   * 于是长回答在界面上只剩最后那一片（截图里模型说了"乙这边要动文件了"，
   * 页面上只有"乙。"），而回合结束时补的那条完整回答又变成第二个气泡。
   */
  t.acc+=piece;
  t.curAns.innerHTML=md(t.acc);
}
function finishAnswer(text,v){
  const t=v||cur();
  if(!text){t.curAns=null;return}
  // 已经在流式的那个气泡就是这条回答 → 换成完整文本，不要再开第二个气泡
  if(t.curAns){t.curAns.innerHTML=md(text);t.curAns=null;return}
  add(el(`<div class="msg ans md"></div>`),t).innerHTML=md(text);
}
function toolStart(d,v){
  const t=v||cur();
  // 一动手就把正文气泡收口：下一轮模型说的话要开新气泡，不能接在上一段后面
  t.curAns=null;
  const c=add(el(`<details class="card run" open><summary><span class="tick"></span><b>${esc(d.name)}</b><span>${esc(d.brief)}</span></summary><pre class="body"></pre></details>`),t);
  t.tools[d.id]=c;
}
function toolEnd(d,v){
  const t=v||cur();
  const c=t.tools[d.id];if(!c)return;
  c.classList.remove('run');c.open=false;
  c.querySelector('summary').innerHTML=`<span class="tick ${d.ok?'ok':'bad'}"></span><b>${esc(d.name)}</b><span>${esc(d.brief||'')}</span>`;
  c.querySelector('.body').textContent=d.out||'(无输出)';
}
function notice(t,kind,v){add(el(`<div class="${kind=='err'?'err':'notice'}">${esc(t)}</div>`),v||cur())}
// 任务清单/用量是"当前这条"的视图：后台那两条各自记着自己的那一份
function setTodos(items,v){const t=v||cur();t.todos=items;if(t===cur())paintTodos(items)}
function paintTodos(items){
  $('#todos').innerHTML=(items&&items.length)?items.map(t=>{
    const st=(t.match(/^\[(.)\]/)||[,' '])[1];
    const cls=st=='x'?'done':st=='>'?'doing':'';
    return `<li class="${cls}"><span class="mark">${st=='x'?'✓':st=='>'?'▶':st=='-'?'✕':'○'}</span><span>${esc(t.replace(/^\[\S\]\s*/,''))}</span></li>`;
  }).join(''):'<li><span class="mark">·</span>（还没开始）</li>';
}
function paintUsage(u,v){
  const t=v||cur();t.usage=u;
  if(t!==cur())return;
  $('#usage').textContent=u&&u.turns?`${u.turns} 轮 · 入 ${(u.prompt/1000).toFixed(1)}k / 出 ${(u.completion/1000).toFixed(1)}k tok`:'';
  $('#usage2').textContent=u?`输入 ${(u.prompt||0).toLocaleString()} / 输出 ${(u.completion||0).toLocaleString()}`:'输入 0 / 输出 0';
}

// ---- SSE：按会话 id 分流 ----
const es=new EventSource('/api/events');
/*
 * 服务端把会话 id 写在 SSE 的 `id:` 字段上，浏览器以 e.lastEventId 暴露，
 * 于是"这条事件属于哪条会话"不用改任何一个已有事件的负载格式就能带出来。
 * 一个坑：lastEventId 是会**粘住**的 —— 没写 id: 的全局事件（sessions、settings、
 * hello、ping）会继承上一条的 id，所以只有服务端确定带 sid 的事件才走这个路由。
 */
const BUMP={answer:1,user:1,notice:1,err:1,approval:1,ask:1};
function on(ev,fn){
  es.addEventListener(ev,e=>{
    const sid=e.lastEventId||curId;
    const v=view(sid);
    fn(v,JSON.parse(e.data),sid);
    if(sid!==curId&&BUMP[ev]){v.unread++;if(ev=='approval'||ev=='ask')v.wait=true;markSessions()}
  });
}
on('delta',(v,d)=>answer(d,v));
on('answer',(v,d)=>{if(!d)notice('(本轮没有正文)',null,v);finishAnswer(d,v)});
on('user',(v,d)=>{v.curAns=null;add(el(`<div class="msg user">${esc(d)}</div>`),v)});
on('tool',(v,d)=>{d.state=='run'?toolStart(d,v):toolEnd(d,v)});
on('todo',(v,d)=>setTodos(d.items,v));
on('usage',(v,d)=>paintUsage(d,v));
on('notice',(v,d)=>notice(d,null,v));
on('err',(v,d)=>notice(d,'err',v));
on('mode',(v,d)=>{v.mode=d.mode;if(v===cur())setMode(d.mode)});
on('opened',(v,d)=>{v.title=d.title;if(d.mode)v.mode=d.mode;if(v===cur()){$('#title').textContent=d.title;setMode(d.mode)}});
// 第一句话一到，标题就要出现在顶栏与侧栏（否则跑十分钟的任务一直叫"新会话"）
on('title',(v,d)=>{v.title=d.title;if(v===cur())$('#title').textContent=d.title;markSessions()});
on('run',(v,d)=>{v.running=d.running;if(v===cur()){stopping=false;paintSend()}markSessions()});
on('approval',(v,d)=>ask(d,'approval',v));
on('ask',(v,d)=>ask(d,'ask',v));
// 服务端改了会话（改名/删除/新起一条）时推一下，列表自己刷新，不用整页重载
es.addEventListener('sessions',()=>loadSessions());
// 设置改了：档位与工作区都是按会话显示的，重新拉一次当前会话才不骗人
es.addEventListener('settings',()=>hydrate(curId));

/*
 * 审批/提问要排队。
 *
 * 单会话时弹窗是单实例没关系；多会话并行之后，两条同时请求确认，
 * 后到的会把前一个覆盖掉，而前一个的 id 再也不会出现 —— 那条会话就永久卡在
 * fut.get(300s) 上，看起来像"agent 无故停了五分钟"。
 */
const asks=[];
let approvalOpen=false, cfgOpen=false;
function ask(d,kind,v){asks.push({d,kind,v});if(asks.length===1)paintAsk()}
function paintAsk(){
  const it=asks[0];
  const m=$('#mask');
  if(!it){approvalOpen=false;m.classList.remove('on');paintSend();return}
  if(cfgOpen)return;   // 设置抽屉开着时不抢它的弹窗；队列会记住这条，关掉抽屉就补上
  approvalOpen=true;
  const dg=$('#dialog'),d=it.d,v=it.v;
  const from=(v&&v.sid!==curId)?`<button class="lnk" data-x="jump" title="切到这条会话再看上下文">切到「${esc(v.title||'会话')}」去看</button>`:'';
  const q=`<span class="q">${asks.length>1?`还有 ${asks.length-1} 个在等`:'&nbsp;'}</span>`;
  if(it.kind=='approval'){
    const ruleBtn=d.tool?`<button class="btn" data-x="allow_rule" title="写入本工作区的规则表：${esc(d.tool)}(${esc(d.pattern)})">以后这类都允许</button>`:'';
    dg.innerHTML=`<div class="kind">需要确认 · ${esc(d.kind)}</div><h3>${esc(d.title)}</h3>
      <pre>${esc(d.detail)}</pre>
      <div class="acts"><button class="btn deny" data-x="deny">拒绝</button>
      ${ruleBtn}<button class="btn" data-x="allow_session">本任务都允许</button>
      <button class="btn pri" data-x="allow_once">允许一次</button></div>
      <div class="who">${from}${q}</div>`;
    dg.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{
      if(b.dataset.x=='jump'){show(v.sid);paintAsk();return}
      decide(d.id,b.dataset.x,'');dismiss(d.id)});
  }else{
    dg.innerHTML=`<h3>Agent 想问你</h3><div style="margin:6px 0 10px">${esc(d.question)}</div>
      <div class="opts">${(d.options||[]).map((o,i)=>`<button class="btn" data-i="${i}">${esc(o)}</button>`).join('')}</div>
      <input type="text" id="answ" placeholder="或自己写一句…" style="margin-top:10px">
      <div class="acts"><button class="btn pri" id="go">发送</button></div>
      <div class="who">${from}${q}</div>`;
    dg.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{
      if(b.dataset.x=='jump'){show(v.sid);paintAsk();return}
      decide(d.id,'','');dismiss(d.id)});
    // 选项按钮挂的是 data-i 不是 data-x：漏了这段绑定，点选项就什么都没发生
    // （上一版重写弹窗时就是这么丢的，只有真去点一个选项才会发现）
    dg.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{
      decide(d.id,'',(d.options||[])[+b.dataset.i]);dismiss(d.id)});
    dg.querySelector('#go').onclick=()=>{decide(d.id,'',dg.querySelector('#answ').value||'按你的建议来');dismiss(d.id)};
  }
  m.classList.add('on');
}
// 撤掉这一条并露出下一条。注意不能只 close()：多会话并行时必须按 id 摘，
// 否则点第二条的按钮会把第一条从队列里带走，而第一条还卡在服务端等回答。
function dismiss(id){const w=asks.findIndex(a=>a.d.id==id);if(w>=0)asks.splice(w,1);paintAsk()}
function decide(id,decision,answer){
  fetch('/api/decide',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({id,decision,answer})});
}

// ---- 控件 ----
function setMode(m){mode=m;document.querySelectorAll('#modes button').forEach(b=>b.classList.toggle('on',b.dataset.m==m))}
document.querySelectorAll('#modes button').forEach(b=>b.onclick=()=>{
  const v=cur();v.mode=b.dataset.m;setMode(b.dataset.m);
  // 档位是**这条会话**的，不是全局的：切档位要带上 sid，否则会把后台那条正在跑的会话也改掉
  fetch('/api/mode',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:b.dataset.m,sid:curId})});
});
$('#newBtn').onclick=()=>{
  // 开新会话不再要求"先停止"：每条会话有自己的引擎与 running，后台那条继续跑。
  fetch('/api/new',{method:'POST'}).then(r=>r.json()).then(d=>{
    if(!d.id)return;
    const v=view(d.id);
    v.el.innerHTML='';v.curAns=null;v.tools={};v.todos=[];v.usage=null;v.title=d.title||'新会话';
    if(d.mode)v.mode=d.mode;   // 没有这个字段时宁可留着上一次的显示，也别自己编一个
    show(d.id);paintUsage(null);box.focus();
    // 工作区/模型这两行只有 /api/state 会告诉我们。但用户手快得已经把话发出去了就别重画：
    // 那会儿服务端的历史还没落到那条用户消息，重画会把刚发出去的气泡抹掉。
    if(!v.running&&!v.el.children.length)hydrate(d.id);
  });
};
function send(){
  const v=cur();
  const t=box.value.trim();if(!t)return;
  if(v.running){
    /*
     * 跑着的时候按回车**不是**停止。
     * 上一版把"发送按钮在跑时变成 ■"的规则顺手套到了回车键上，
     * 于是用户在新会话里打完一句话按回车，被杀掉的是后台那条跑了十分钟的任务。
     * 停止只留 ■ 一个入口，这句话留在框里不丢。
     */
    notice('这条会话正在跑：要另起一件事点「＋新任务」，要停下它按右下角的 ■。这句话还留在框里。');
    return;
  }
  box.value='';box.style.height='auto';
  v.running=true;stopping=false;paintSend();markSessions();
  fetch('/api/task',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({text:t,sid:curId})})
    .then(r=>r.json().then(d=>({code:r.status,d:d})))
    .then(x=>{
      if(x.d&&x.d.sid&&x.d.sid!==curId)show(x.d.sid);
      if(!x.d.ok){v.running=false;stopping=false;paintSend();markSessions();notice(x.d.error||'发送失败','err')}
    })
    .catch(()=>{});
}
function stopNow(){
  const v=cur();
  // 同一个按钮：跑着的时候它就是停止。另起一个"停止"按钮放在旁边，
  // 用户要在两个长得很像的圆钮之间做选择，得不偿失。
  if(!v.running||stopping)return;
  stopping=true;paintSend();
  fetch('/api/stop',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({sid:curId})});
}
function paintSend(){
  const b=$('#send'),r=!!cur().running;
  b.classList.toggle('stop',r);
  b.disabled=r&&stopping;
  b.textContent=r?'■':'➤';
  b.title=r?(stopping?'已请求停止，正在收尾…':'停止这一轮（跑完当前动作就收手）'):'发送';
}
$('#send').onclick=()=>{cur().running?stopNow():send()};
box.addEventListener('keydown',e=>{if(e.key=='Enter'&&!e.shiftKey){e.preventDefault();send()}});
box.addEventListener('input',()=>{box.style.height='auto';box.style.height=Math.min(160,box.scrollHeight)+'px'});

/* ---- 侧栏会话列表 ----
 * 列表来自服务端（磁盘索引，带 running 与条数），徽标与未读数来自本地 view：
 * 后者只有浏览器知道（它看见了多少），所以每次重画都用这两份拼。
 */
let sessList=[];
function post(url,body){
  return fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})})
    .then(r=>r.ok?r.json():Promise.reject(r.status));
}
function loadSessions(){
  fetch('/api/sessions').then(r=>r.json()).then(list=>{
    sessList=list;
    // 标题由服务端从第一句话生成，所以跑完一轮要把本地视图的标题一起换掉
    list.forEach(m=>{const v=views[m.id];if(v){v.title=m.title;if(!m.running)v.running=false}});
    markSessions();
  });
}
function markSessions(){
  const box=$('#sessions');
  const live=Object.keys(views).filter(id=>id&&!sessList.some(m=>m.id===id))
    .map(id=>({id:id,title:views[id].title||'新会话',messages:0,mode:views[id].mode||mode,updated:Date.now()}));
  const all=live.concat(sessList);
  if(!all.length){box.innerHTML='<div class="it" style="cursor:default">（还没有历史会话）</div>';return}
  box.innerHTML=all.slice(0,14).map(m=>{
    const v=views[m.id]||{};
    const run=v.running||m.running;
    const nb=v.wait?'<span class="nb" title="这条会话在等你回答">!</span>'
      :(v.unread?`<span class="nb" title="切过去看">${v.unread}</span>`:'');
    return `<div class="it${m.id===curId?' cur':''}${run?' run':''}${v.wait?' wait':''}" data-id="${m.id}" data-t="${esc(m.title)}" title="${esc(m.workspace||'')}">
      <span class="act"><b data-a="ren" title="重命名">✎</b><b data-a="del" title="删除（移进 sessions/.trash，可恢复）">✕</b></span>${nb}
      ${esc(m.title)}<br><i>${run?'正在跑 · ':''}${m.messages} 条 · ${esc(m.mode||'')} · ${new Date(m.updated).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}</i></div>`;
  }).join('');
  box.querySelectorAll('.it').forEach(e=>{
    const id=e.dataset.id;
    if(!id)return;
    e.onclick=ev=>{
      const a=(ev.target.dataset||{}).a;
      if(a==='ren'){
        const t=prompt('会话标题',e.dataset.t||'');
        if(t&&t.trim())post('/api/rename',{id:id,title:t}).then(loadSessions);
        return;
      }
      if(a==='del'){
        if(!confirm('删除这个会话？文件会移进 sessions/.trash，不是就地抹掉。'))return;
        // 409 的正文里写着"为什么不让删"（正在跑），所以不能只看 ok
        fetch('/api/delete',{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({id:id})})
          .then(r=>r.json().then(d=>({ok:r.ok,d:d})))
          .then(x=>{
            if(!x.ok){alert((x.d&&x.d.error)||'删除失败');return}
            dropView(id);loadSessions();
          });
        return;
      }
      openSession(id);
    };
  });
}
function dropView(id){
  const v=views[id];
  if(v){v.el.remove();delete views[id]}
  for(let i=asks.length-1;i>=0;i--)if(asks[i].v&&asks[i].v.sid===id)asks.splice(i,1);
  if(id===curId){curId='';show(Object.keys(views)[0]||'')}
  paintAsk();
}
function openSession(id){
  if(id===curId)return;
  // 已经在内存里的那条（尤其是后台正在跑的）直接切过去看：重新拉 state 会把
  // 正在流式输出的半截回答丢掉，还会把工具卡重画成"已完成"的样子。
  if(views[id]&&views[id].hydrated){show(id);return}
  post('/api/open',{id:id})
    .then(()=>hydrate(id))
    .catch(code=>notice('打不开这个会话（'+code+'）','err'));
}
function hydrate(sid){
  return fetch('/api/state?sid='+encodeURIComponent(sid||'')).then(r=>r.json()).then(applyState,s=>s);
}
// 把服务端给的会话状态画进**它自己那条**视图（不是"当前看见的那条"）
function applyState(s){
  const v=view(s.sessionId||curId);
  v.hydrated=true;v.running=!!s.running;v.title=s.title||'新会话';v.mode=s.mode;
  v.workspace=s.workspace;v.model=s.model;
  v.el.innerHTML='';v.curAns=null;v.tools={};
  (s.messages||[]).forEach(m=>{
    if(m.role=='user')add(el(`<div class="msg user">${esc(m.content)}</div>`),v);
    else if(m.role=='assistant'&&m.content)add(el(`<div class="msg ans md">${md(m.content)}</div>`),v);
    else if(m.role=='tool')add(el(`<details class="card"><summary><span class="tick"></span><b>${esc(m.name||'tool')}</b><span>${esc((m.content||'').split(String.fromCharCode(10))[0].slice(0,60))}</span></summary><pre class="body">${esc(m.content)}</pre></details>`),v);
  });
  // 挂着没答的审批/提问：SSE 只推过一次，刷新就没了，而引擎还在等 —— 必须从 state 里补回来
  (s.pending||[]).forEach(p=>ask(p.data,p.ev,v));
  v.todos=(s.todos||[]).map(t=>(t.status=='done'?'[x]':t.status=='doing'?'[>]':'[ ]')+' '+t.text);
  paintUsage(s.usage,v);
  /*
   * 首屏时 curId 还是空的，"这条是不是眼前这条"只能按 sid 判，不能拿 cur() 比 ——
   * 那样一比就不相等，标题/工作区/模型/任务清单全都不会画，左栏永远停在占位符上
   * （截图里抓到的就是这个：会话列表都出来了，工作区还是"—"）。
   */
  if(!curId||v.sid===curId)show(v.sid);else markSessions();
  return s;
}

// ---- 设置抽屉 ----
$('#cfgBtn').onclick=()=>{
  fetch('/api/settings').then(r=>r.json()).then(c=>{
    cfgOpen=true;approvalOpen=true;
    const dg=$('#dialog');
    dg.innerHTML=`<h3>设置</h3>
      <div class="fld"><label>模型</label><input type="text" id="fModel" value="${esc(c.model)}"></div>
      <div class="fld"><label>网关 Base URL</label><input type="text" id="fBase" value="${esc(c.baseUrl)}"></div>
      <div class="fld"><label>工作区</label><input type="text" id="fWs" value="${esc(c.workspace)}"></div>
      <div class="fld"><label>权限档位</label><input type="text" id="fMode" value="${esc(c.mode)}" placeholder="plan / ask / auto"></div>
      <div class="fld"><label>单次回答上限（token，0=交给网关）</label><input type="text" id="fMax" value="${esc(c.maxTokens)}"></div>
      <div class="kv">这里改的是<b>全局默认</b>：模型与网关会立刻发给所有会话（正在跑的那条从下一次请求起生效）；
        工作区与档位只影响<b>之后新建</b>的会话，已有会话留在自己的工作区里。</div>
      <div class="fld"><label>密钥</label><div class="kv">${c.hasKey?('已设置 '+esc(c.keyHint)+'…'):'<b style="color:var(--warn)">未设置</b>（跑 haoai key sk-…）'}</div></div>
      <div class="grp" style="margin-top:12px">实验特性</div>
      ${c.flags.map(f=>`<label class="sw"><input type="checkbox" data-k="${f.key}" ${f.on?'checked':''}>
        <span><span class="t">${esc(f.title)}</span><br><span class="d">${esc(f.what)}</span></span></label>`).join('')}
      <div class="grp" style="margin-top:12px">本工作区权限规则</div>
      <div class="kv">${c.rules.length?c.rules.map(r=>esc(r.text)).join('<br>'):'（空 —— 全部交给档位决定）'}</div>
      <div class="acts"><button class="btn" id="cfgClose">关闭</button><button class="btn pri" id="cfgSave">保存</button></div>`;
    $('#mask').classList.add('on');
    dg.querySelector('#cfgClose').onclick=closeCfg;
    dg.querySelector('#cfgSave').onclick=()=>{
      const flags={};dg.querySelectorAll('[data-k]').forEach(i=>flags[i.dataset.k]=i.checked);
      fetch('/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({model:dg.querySelector('#fModel').value,baseUrl:dg.querySelector('#fBase').value,
          workspace:dg.querySelector('#fWs').value,mode:dg.querySelector('#fMode').value,
          maxTokens:String(dg.querySelector('#fMax').value.replace(/\D/g,"")||"0"),flags})})
        .then(r=>r.json()).then(()=>{closeCfg();notice('设置已保存：所有会话下一条消息起用新的模型/网关')});
    };
  });
};
function closeCfg(){
  cfgOpen=false;approvalOpen=false;
  $('#mask').classList.remove('on');
  if(asks.length)paintAsk();else paintSend();
}

/*
 * 启动：先拿服务端认为的"当前会话"（重启时它会接上上次用的那条）。
 * 一条会话都没有时立刻开一条 —— 之后每个事件都有确定的 sid，
 * 不需要再处理"这条事件属于哪条会话"的空档期。
 */
fetch('/api/state').then(r=>r.json()).then(s=>{
  if(s.sessionId){applyState(s);loadSessions();return}
  return post('/api/new',{}).then(d=>{
    const v=view(d.id);if(d.mode)v.mode=d.mode;show(d.id);loadSessions();box.focus();hydrate(d.id);
  }).catch(()=>{loadSessions();notice('开不了新会话，检查一下服务是否还在跑','err')});
});
</script>
</body>
</html>
