[versions]
agp = "9.4.0"   # 对齐 rikkahub（Compose 2026.09 需要 AGP 9.1.0+）
kotlin = "2.4.10"
coreKtx = "1.16.0"
documentfile = "1.0.1"
activityCompose = "1.11.0"
composeBom = "2026.09.00"   # 与 rikkahub 对齐（其实测系统浮层无闪现/位移）
lifecycle = "2.9.1"
okhttp = "4.12.0"
coroutines = "1.10.2"
serializationJson = "1.9.0"
backdrop = "2.0.0"
junit = "4.13.2"
work = "2.10.1"
# markdown 渲染升级：intellij-markdown 的 GFM fork（task-list/math 扩展），Apache-2.0
# （上游仓库保留 Apache LICENSE，fork 自 JetBrains/markdown；与主项目 AGPL 无涉）
jetbrainsMarkdown = "d79a97cc8e"
# 公式原生渲染（GPL-2.0 + Classpath 例外，fork 保留例外声明，已核实 LICENSE）：替代
# KaTeX WebView——池上限 3 导致公式密集消息互相销毁出现空白、宽公式被裁、流式闪烁。
# 用 noties 的 fork（JitPack 构建了含 Android 封装的 AAR；noties 原组
# 的 JitPack 产物是空壳 jar）。版本 1.5
jlatexmathAndroid = "1.5"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-documentfile = { group = "androidx.documentfile", name = "documentfile", version.ref = "documentfile" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serializationJson" }
backdrop = { group = "io.github.kyant0", name = "backdrop", version.ref = "backdrop" }
androidx-work = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
jetbrains-markdown = { module = "com.github.a953179255:markdown", version.ref = "jetbrainsMarkdown" }
jlatexmath-android = { module = "com.github.a953179255.jlatexmath-android:jlatexmath", version.ref = "jlatexmathAndroid" }
jlatexmath-android-font-greek = { module = "com.github.a953179255.jlatexmath-android:jlatexmath-font-greek", version.ref = "jlatexmathAndroid" }
shizuku-api = { group = "dev.rikka.shizuku", name = "api", version = "13.1.5" }
shizuku-provider = { group = "dev.rikka.shizuku", name = "provider", version = "13.1.5" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
